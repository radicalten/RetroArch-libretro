name: Wii-ppc-5-done
on:
  push:
    branches:
    - fast
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Compile Retroarch
      run: |
        cd .
        make -f Makefile.griffin2 platform=wii EXTERNAL_LIBOGC=1 GX_PTHREAD_LEGACY=0
    - name: Create tarball
      run: |
          tar -cvf retroarch_wii.dol.tgz retroarch_wii.dol
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Artifact
        path: |
          ./retroarch_wii.dol.tgz
